name: Sync Parish Magazine PDFs
on:
  workflow_dispatch:
  schedule:
    - cron: '20 7 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_pdfs.py'
      - 'scripts/run_sync.py'
      - 'docs/config.json'
      - '.github/workflows/sync-pdfs.yml'

permissions:
  contents: write

concurrency:
  group: magazine-sync
  cancel-in-progress: false

jobs:
  update-magazines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF processing tools
        run: pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5' 'pymupdf>=1.24,<2'
      - name: Mirror official magazines and make covers
        run: python scripts/run_sync.py
      - name: Commit new and updated magazines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/library.json docs/pdfs docs/covers
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh published magazine editions'
            git push
          fi
